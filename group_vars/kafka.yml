kafka_version: "4.1.1"
scala_version: "2.13"

kafka_user: kafka
kafka_group: kafka

kafka_base_dir: /opt/kafka
kafka_data_dir: /var/lib/kafka
kafka_log_dir: /var/log/kafka

kafka_port: 9092
kafka_controller_port: 9093

kafka_heap_opts: "-Xms4G -Xmx4G"

# Один ID для всего KRaft cluster
kafka_cluster_id: "REPLACE_WITH_GENERATED_CLUSTER_ID"

kafka_num_partitions: 12

kafka_default_replication_factor: 3

kafka_min_insync_replicas: 2

kafka_offsets_replication_factor: 3

kafka_transaction_replication_factor: 3

kafka_transaction_min_isr: 2

kafka_log_retention_hours: 168

kafka_log_segment_bytes: 1073741824

kafka_auto_create_topics: false

kafka_download_url: >-
  https://downloads.apache.org/kafka/{{ kafka_version }}/
  kafka_{{ scala_version }}-{{ kafka_version }}.tgz

kafka_topics:
  - name: user-events
    partitions: 24
    replication_factor: 3
    configs:
      retention.ms: "604800000"
      min.insync.replicas: "2"
  - name: page-events
    partitions: 24
    replication_factor: 3
    configs:
      retention.ms: "604800000"
      min.insync.replicas: "2"
  - name: auth-events
    partitions: 12
    replication_factor: 3
    configs:
      retention.ms: "2592000000"
      min.insync.replicas: "2"
  - name: business-events
    partitions: 12
    replication_factor: 3
    configs:
      retention.ms: "2592000000"
      min.insync.replicas: "2"
  - name: dlq
    partitions: 6
    replication_factor: 3
    configs:
      retention.ms: "2592000000"
