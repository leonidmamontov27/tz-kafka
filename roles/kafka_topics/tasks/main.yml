- name: Create Kafka topics
  command: >
    {{ kafka_base_dir }}/bin/kafka-topics.sh
    --bootstrap-server {{ groups['kafka'][0] }}:{{ kafka_port }}
    --create
    --if-not-exists
    --topic {{ item.name }}
    --partitions {{ item.partitions }}
    --replication-factor {{ item.replication_factor }}
  loop: "{{ kafka_topics }}"
  run_once: true

- name: Configure topic retention
  command: >
    {{ kafka_base_dir }}/bin/kafka-configs.sh
    --bootstrap-server {{ groups['kafka'][0] }}:{{ kafka_port }}
    --entity-type topics
    --entity-name {{ item.name }}
    --alter
    --add-config
    {% for key, value in item.configs.items() %}
    {{ key }}={{ value }}{% if not loop.last %},{% endif %}
    {% endfor %}
  loop: "{{ kafka_topics }}"
  run_once: true
